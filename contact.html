<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Genesis — Contact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/normalize.css"/>
  <link rel="stylesheet" href="css/main.css"/>
</head>
<body>
          
          <!-- Header -->
          <header class="site-header">
            <div class="container">
              <a href="index.html" class="logo">Genesis</a>
              <nav class="main-nav">
                <a href="projects.html">Projects</a>
                <a href="contact.html" class="is-active">Contact</a>
              </nav>
            </div>
          </header>

  <main>
          <div class="container">

            <!-- Intro -->
            <section class="contact-hero">
              <div class="contact-hero__intro">
                <h1>Full set of great features to make your product fresh</h1>
                <p>
                  Our favorite brands are our friends! We help them to achieve
                  their goals, they help us to stay sharp.
                </p>
              </div>

              <!-- Form -->
              <form class="contact-hero__form" action="#" method="post">

                <div class="form-field">
                  <label for="name">Name</label>
                  <input type="text" id="name" name="name" />
                </div>

                <div class="form-field">
                  <label for="email">Email</label>
                  <input type="email" id="email" name="email" />
                </div>

                <div class="form-field">
                  <label for="message">Message</label>
                  <textarea id="message" name="message" rows="1"></textarea>
                </div>

                <button type="submit" class="btn btn--primary">Submit</button>

              </form>

            </section>

            <!-- Map -->
            <div class="contact-map">
              <img src="images/contact-map.jpg" alt="Map showing studio location" />
            </div>

          </div>

  </main>

          <!-- Footer -->
          <footer class="site-footer">

            <div class="container">

              <a href="index.html" class="logo">Genesis</a>
              <nav class="footer-nav" aria-label="Footer">
                <a href="projects.html">Projects</a>
                <a href="contact.html">Contact</a>

                    <!-- Socials -->
                    <ul class="footer-social">

                      <li>
                        <a href="#" aria-label="Dribbble">
                          <img src="images/dribble.png" alt="Dribbble" />
                        </a>
                      </li>

                      <li>
                        <a href="#" aria-label="Instagram">
                          <img src="images/instagram.png" alt="Instagram" />
                        </a>
                      </li>

                      <li>
                        <a href="#" aria-label="Twitter">
                          <img src="images/twitter.png" alt="Twitter" />
                        </a>
                      </li>
                    </ul>
              </nav>

            </div>
          </footer>
</body>
</html>
